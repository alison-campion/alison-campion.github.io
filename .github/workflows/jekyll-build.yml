name: Jekyll Build

on:
  push:
    branches:
      - main # or your default branch
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Ruby
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true

      # Step 3: Install system dependencies (Imagemagick)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      # Step 4: Install gems
      - name: Install gems
        run: bundle install

      # Step 5: Build the Jekyll site
      - name: Build site
        run: bundle exec jekyll build

      # Optional: Upload site as artifact
      - name: Upload _site
        uses: actions/upload-artifact@v3
        with:
          name: jekyll-site
          path: _site
